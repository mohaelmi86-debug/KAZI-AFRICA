name: Sprint 1 quality gate

on:
  push:
    branches:
      - main
      - refactor/sprint-1-navigation-performance
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint-1-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Vite production build
        run: bun run build
