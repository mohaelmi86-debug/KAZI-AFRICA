name: KAZI Africa CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kazi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, antivirus tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Employment antivirus protocol tests
        run: bun run test:employment:scanner
      - name: Production build
        run: bun run build
